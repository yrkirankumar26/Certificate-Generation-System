{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="fa fa-eye me-2 gradient-text"></i>Preview Generated Certificates</h3>
    {% if zip_name %}
    <a class="btn btn-neon" href="{{ url_for('download_zip', name=zip_name) }}"><i class="fa fa-file-zipper me-2"></i>Download ZIP</a>
    {% endif %}
  </div>
  {% if not generated %}
    <div class="glass-card p-4 text-center">Nothing to preview yet. <a href="{{ url_for('upload') }}">Generate now</a>.</div>
  {% else %}
  <div class="row g-3">
    {% for g in generated %}
    <div class="col-md-6 col-lg-4">
      <div class="glass-card p-3 h-100">
        <img src="{{ url_for('certificate_file', filename=g.png) }}" class="img-fluid rounded mb-2 cert-thumb" data-full="{{ url_for('certificate_file', filename=g.png) }}">
        <div class="d-flex justify-content-between align-items-center">
          <div><strong>{{ g.name }}</strong><br><code class="small">{{ g.certificate_id }}</code></div>
          <a class="btn btn-sm btn-outline-light" href="{{ url_for('certificate_file', filename=g.pdf) }}" target="_blank"><i class="fa fa-file-pdf"></i></a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
  {% endif %}
</div>
<div class="modal fade" id="zoomModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content bg-transparent border-0"><img id="zoomImg" class="img-fluid rounded"></div></div></div>
{% endblock %}
